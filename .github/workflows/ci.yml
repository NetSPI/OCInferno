name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          # Don't leave the GITHUB_TOKEN in the runner's git config where PR code
          # could reuse it (defense-in-depth; the token is read-only here anyway).
          persist-credentials: false

      - name: Setup Python
        # v6.2.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: python -m pip install ruff==0.15.22

      - name: Ruff (blocking)
        run: ruff check .

  unit-tests:
    name: Unit Tests (py${{ matrix.python-version }}) [${{ github.ref_name }}]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          # Don't leave the GITHUB_TOKEN in the runner's git config where PR code
          # could reuse it (defense-in-depth; the token is read-only here anyway).
          persist-credentials: false

      - name: Setup Python
        # v6.2.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install .[dev]

      - name: Run tests
        # unit + module-contract + per-module enum harness + opengraph integration/golden.
        run: python -m pytest -q -ra tests/unit tests/module_contracts tests/enum_modules tests/integration

  package:
    name: Package smoke (wheel builds, installs, bundles data)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          # Don't leave the GITHUB_TOKEN in the runner's git config where PR code
          # could reuse it (defense-in-depth; the token is read-only here anyway).
          persist-credentials: false

      - name: Setup Python
        # v6.2.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Build and install the wheel
        run: |
          python -m pip install -U pip build
          python -m build --wheel
          python -m pip install dist/*.whl

      - name: Smoke the installed package from outside the source tree
        # Run from $RUNNER_TEMP so we import the INSTALLED package, not ./ocinferno.
        # Verifies the entry point, the bundled data files (mappings + a per-module
        # OpenGraph data file), and that the databases path is writable (never under
        # the read-only site-packages install dir). The CLI dispatch chain imports
        # `oci` at module load time, so `ocinferno --help` needs the full runtime
        # deps installed (no `--no-deps` shortcut here).
        working-directory: ${{ runner.temp }}
        run: |
          ocinferno --help >/dev/null
          python - <<'PY'
          import json, tempfile, os
          from importlib import resources
          for name in ("database_info.json", "module_mappings.json"):
              data = json.loads(resources.files("ocinferno.mappings").joinpath(name).read_text())
              assert data, f"{name} is empty/unbundled"
          assert resources.files("ocinferno.modules.opengraph.utilities.helpers").joinpath(
              "data/static_constants.json"
          ).is_file(), "per-module OpenGraph data not bundled"
          from ocinferno.core.db import DataController
          assert "site-packages" not in DataController.database_path, "databases path under site-packages"
          d = tempfile.mkdtemp()
          DataController.database_path = os.path.join(d, "ocinferno.db")
          DataController.metadata_db = DataController.service_db = DataController.database_path
          dc = DataController()
          assert dc.create_service_tables_from_schema(), "service tables failed to build"
          dc.close()
          print("package smoke OK")
          PY
