name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target repository"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      run_tests:
        description: "Run unit tests before publish"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'NetSPI/OCInferno' &&
      github.actor == 'WebbinRoot' &&
      github.triggering_actor == 'WebbinRoot' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.repository }}
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Setup Python
        # v6.2.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Run unit tests
        if: ${{ inputs.run_tests }}
        run: |
          python -m pip install .[dev]
          python -m pytest -q -ra tests/unit

      - name: Build dist
        run: python -m build

      - name: Smoke built wheel before publishing
        # Install the freshly-built wheel and assert bundled mappings resolve + a DB
        # builds, from outside the source tree -- so we never publish a broken artifact.
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          python - <<'PY'
          import json, tempfile, os
          from importlib import resources
          for name in ("database_info.json", "module_mappings.json"):
              assert json.loads(resources.files("ocinferno.mappings").joinpath(name).read_text()), name
          from ocinferno.core.db import DataController
          d = tempfile.mkdtemp()
          DataController.database_path = os.path.join(d, "ocinferno.db")
          DataController.metadata_db = DataController.service_db = DataController.database_path
          dc = DataController(); assert dc.create_service_tables_from_schema(); dc.close()
          print("pre-publish wheel smoke OK")
          PY

      - name: Publish to PyPI
        if: ${{ inputs.repository == 'pypi' }}
        # v1.13.0 (release/v1)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247

      - name: Publish to TestPyPI
        if: ${{ inputs.repository == 'testpypi' }}
        # v1.12.4 (release/v1)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
        with:
          repository-url: https://test.pypi.org/legacy/
